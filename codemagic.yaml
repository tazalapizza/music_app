workflows:

  # ===========================================================================
  # iOS — UNSIGNED build for local sideloading (AltStore / Sideloadly)
  # ===========================================================================
  # No Apple Developer account or Codemagic code-signing setup required.
  # This produces an unsigned .app zipped as .ipa. AltStore/Sideloadly will
  # do the actual signing on your Mac/PC with your free Apple ID when you
  # install it to your iPhone. Re-sign every ~7 days per Apple's free-ID limit.
  #
  # UPDATED from the original version of this file (twice now):
  #   - v1 only ran "cap sync ios", which does nothing without an existing
  #     ios/ folder to sync into - since ios/ is gitignored except for one
  #     hand-written file (see this project's .gitignore), a fresh checkout
  #     never had a usable project there at all.
  #   - v2 added a directory-exists check to decide between "cap add ios"
  #     and "cap sync ios" - but this was ALSO wrong, because the one
  #     tracked file (SystemVolumePlugin.swift) makes ios/ "exist" in a
  #     fresh checkout without the rest of the Xcode project (Podfile
  #     included) actually being there, so the check picked "cap sync ios"
  #     and pod install failed looking for a nonexistent Podfile.
  #   - v3 sidesteps detecting "complete vs partial" ios/ entirely: it
  #     stashes the one hand-written Swift file, wipes ios/ unconditionally,
  #     always runs a genuinely fresh "cap add ios", then restores the
  #     stashed file into the now-complete generated project. This DID fix
  #     the "cap sync ios ran instead of cap add ios" problem, but a
  #     "No Podfile found" error persisted even after a confirmed-fresh
  #     "cap add ios" - which turned out to be a separate, deeper issue:
  #   - v4 (current): Capacitor 8 changed the DEFAULT iOS dependency manager
  #     from CocoaPods to Swift Package Manager (SPM). "cap add ios" on
  #     Capacitor 8 generates a CapApp-SPM/ folder, not a Podfile, by
  #     design - there was never a Podfile to find, on any version of this
  #     script, because this project is on @capacitor/ios ^8.0.0. The
  #     "Install CocoaPods dependencies" / "pod install" step has been
  #     removed entirely; SPM dependency resolution happens automatically
  #     as part of the xcodebuild step, no separate install command needed.
  #   - capacitor.config.json (committed to the repo, NOT gitignored) already
  #     points the app at the live backend (server.url) with cleartext HTTP
  #     enabled - "cap add ios" picks this up automatically, no extra step
  #     needed here for that.
  # ---------------------------------------------------------------------------
  ios-capacitor-unsigned:
    name: iOS Capacitor (Unsigned, for AltStore/Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      vars:
        # NOTE: this is -project, not -workspace, because Capacitor 8's
        # default SPM-based iOS setup (see the header comment above) does
        # not generate an App.xcworkspace at all - only CocoaPods-based
        # projects had one (it existed to tie your project + Pods.xcodeproj
        # together, which SPM doesn't need). Confirmed via this project's
        # own Codemagic build log: `ls ios/App/` showed App/, App.xcodeproj/,
        # and CapApp-SPM/, with no .xcworkspace present.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Add iOS platform (always fresh - see comment)
        script: |
          set -e
          # FIXED BUG: the previous version of this step checked
          # `if [ ! -d "ios" ]` to decide between "cap add ios" (full
          # scaffold + Podfile) and "cap sync ios" (sync-only, assumes a
          # complete project already exists). That check was wrong here
          # specifically BECAUSE SystemVolumePlugin.swift is committed to
          # git at ios/App/App/SystemVolumePlugin.swift (see .gitignore's
          # negated path pattern) - a fresh git checkout of this repo
          # already has an ios/ directory containing that one file, so the
          # directory-exists check passed even though nothing else (Podfile,
          # the Xcode project, AppDelegate.swift, etc.) actually existed yet.
          # "cap sync ios" ran instead of "cap add ios", found no Podfile to
          # sync against, and pod install failed with ENOENT.
          #
          # Fix: stash the one hand-written file we actually care about
          # BEFORE touching ios/ at all, wipe whatever partial ios/ came
          # from the checkout, run a genuinely fresh "cap add ios" (which
          # generates the full scaffold including Podfile), then restore
          # the hand-written file into the now-complete project structure.
          # This sidesteps the "is ios/ complete or partial" ambiguity
          # entirely rather than trying to detect it correctly.
          if [ -f "ios/App/App/SystemVolumePlugin.swift" ]; then
            mkdir -p /tmp/native-plugin-stash
            cp ios/App/App/SystemVolumePlugin.swift /tmp/native-plugin-stash/
          fi
          rm -rf ios
          npx cap add ios
          if [ -f "/tmp/native-plugin-stash/SystemVolumePlugin.swift" ]; then
            cp /tmp/native-plugin-stash/SystemVolumePlugin.swift ios/App/App/SystemVolumePlugin.swift
          fi
          # Light confirmation output (not full diagnostics anymore - the
          # earlier Podfile-not-found investigation is resolved, see the
          # note above the removed "Install CocoaPods dependencies" step).
          echo "iOS platform added. Structure:"
          ls -la ios/App/

      - name: Verify hand-written native files survived the checkout
        script: |
          set -e
          if [ ! -f "ios/App/App/SystemVolumePlugin.swift" ]; then
            echo "ERROR: SystemVolumePlugin.swift is missing from ios/App/App/."
            echo "Check that it is committed to git and NOT excluded by .gitignore"
            echo "(it should be explicitly re-included via a negated ! pattern)."
            exit 1
          fi
          echo "SystemVolumePlugin.swift found - OK"

      # NOTE: the "Install CocoaPods dependencies" / "pod install" step that
      # used to be here has been REMOVED. Root cause of the "No Podfile
      # found" failure: Capacitor 8 changed the default iOS dependency
      # manager from CocoaPods to Swift Package Manager (SPM) - "cap add
      # ios" on Capacitor 8 generates a CapApp-SPM/ folder instead of a
      # Podfile, by design, not as a bug. There is no Podfile to install
      # against in an SPM-based project at all, so this step was simply the
      # wrong tool for what "cap add ios" actually produces on Capacitor 8.
      # SPM dependency resolution happens automatically as part of the
      # xcodebuild step below (Xcode resolves Swift Package dependencies as
      # part of a normal build), no separate install command needed.
      #
      # KNOWN RISK TO WATCH FOR: there is a documented Capacitor 8 + SPM
      # issue (ionic-team/capacitor#8325) where plugin products from
      # CapApp-SPM sometimes aren't automatically linked to the App target
      # in Xcode, which would surface as a build failure in the next step
      # (xcodebuild archive) - specifically a missing-symbol or
      # missing-module error mentioning the plugin, most likely
      # @capgo/capacitor-native-audio given it's this project's only
      # third-party Capacitor plugin. If the next step fails that way,
      # that's the known issue to investigate, not a new mystery.

      - name: Build unsigned .app archive
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/App.xcarchive \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned .app as .ipa (Payload/App.app zipped)
        script: |
          set -e
          APP_PATH="build/ios/App.xcarchive/Products/Applications/App.app"
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -y ../App-unsigned.ipa Payload
          cd ../../..
          echo "Unsigned IPA created at build/ios/App-unsigned.ipa"

    artifacts:
      - build/ios/App-unsigned.ipa
      - build/ios/App.xcarchive

    publishing:
      email:
        recipients:
          - your-email@example.com     # <-- put your real email here
        notify:
          success: true
          failure: true
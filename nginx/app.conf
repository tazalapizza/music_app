# nginx/app.conf
#
# Replace vibing.ddnsfree.com below with your actual Dynu hostname
# before running 'make https-init' for the first time (see the Makefile's
# https-init target, which also reminds you of this).
#
# Port 80: ONLY serves the ACME HTTP-01 challenge Certbot needs to prove
# domain ownership, plus a redirect to HTTPS for anything else. This is
# required to exist and be reachable on port 80 for certificate issuance
# and renewal to work at all - Let's Encrypt's validation servers connect
# to it directly.
server {
    listen 80;
    server_name vibing.ddnsfree.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: the real, TLS-terminated entry point. Proxies everything to
# music_app over the internal Docker network (container name + internal
# port, not localhost - these are separate containers on the same Compose
# network, resolved via Docker's built-in DNS).
server {
    listen 443 ssl;
    server_name vibing.ddnsfree.com;

    ssl_certificate /etc/letsencrypt/live/vibing.ddnsfree.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibing.ddnsfree.com/privkey.pem;

    # Reasonable modern defaults - not exhaustive hardening, but sane for a
    # personal self-hosted app rather than a public-facing production
    # service with stricter compliance requirements.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Music streaming uses HTTP Range requests (see server.js's /api/stream
    # endpoint) - proxy_buffering off and these headers ensure nginx
    # forwards range/partial-content behavior through correctly instead of
    # buffering the whole response before passing it on, which would
    # reintroduce exactly the kind of startup-delay problem this whole
    # HTTPS migration was partly trying to get away from.
    proxy_buffering off;
    client_max_body_size 100M;

    location / {
        proxy_pass http://music_app:3838;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support, harmless to include even if not currently used
        # - cheap to have ready rather than needing to revisit this file if
        # a future feature needs it.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
# nginx/app-bootstrap.conf
#
# TEMPORARY config used ONLY during first-time certificate issuance (see
# the Makefile's https-init target). Deliberately has NO port-443/SSL block
# at all - this is what fixes the chicken-and-egg problem the original
# single-file app.conf ran into: nginx refused to start entirely because
# its 443 block referenced a certificate file that didn't exist yet
# (confirmed via a real "cannot load certificate ... No such file or
# directory" crash loop in production), which meant nginx could never even
# serve the port-80 ACME challenge Certbot needed to obtain that very
# certificate in the first place.
#
# This file only ever needs port 80, serving the ACME HTTP-01 challenge.
# https-init copies this into place as the active config, requests the
# cert, then swaps to the real nginx/app.conf (which DOES have both ports,
# since by that point the certificate genuinely exists) and restarts nginx
# once more onto the full config. You should not need to touch this file
# directly - see the Makefile's https-init target.
server {
    listen 80;
    server_name vibing.ddnsfree.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Bootstrap nginx - obtaining certificate, this is expected to be temporary.';
        add_header Content-Type text/plain;
    }
}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibing</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Icon sprite: symbols reused via <use> below instead of duplicating the
       same inline SVG markup at every call site. Paths carry no fill/stroke/
       size of their own so each <use> still inherits its own styling from
       the wrapping <svg> (color, stroke-width, dimensions) exactly as the
       inline copies did. -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></symbol>
    <symbol id="icon-shuffle" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></symbol>
  </svg>
  <div class="app">
    <header class="topbar">
      <div class="path-breadcrumb" id="breadcrumb"></div>
      <div class="search-wrap">
        <button id="searchScopeBtn" class="search-scope-btn" title="Search everywhere (click to search only the current folder)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></button>
        <input type="text" id="searchInput" class="search-input" placeholder="Search folders and files..." autocomplete="off">
        <button id="searchClearBtn" class="search-clear hidden" title="Clear search">✕</button>
      </div>
      <div class="topbar-actions">
        <button id="newFolderBtn" title="New folder">+ Folder</button>
        <div class="upload-wrap">
          <button id="uploadBtn" title="Uploads">⬆ Uploads</button>
          <input type="file" id="uploadInput" multiple hidden>
          <div id="uploadPanel" class="upload-panel hidden">
            <div class="upload-panel-header">
              <button id="uploadClearBtn" title="Clear completed and failed uploads">Clear</button>
              <button id="uploadExplorerBtn" title="Choose files"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#6ea8fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><use href="#icon-folder"></use></svg>Browse files</button>
            </div>
            <div id="uploadList" class="upload-list">
              <div class="upload-empty" id="uploadEmpty">No uploads yet</div>
            </div>
          </div>
        </div>
        <button id="settingsBtn" title="Settings"><span id="settingsCogIcon">⚙</span></button>
        <button id="authBtn" title="Log in to make changes"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Log in</button>
      </div>
    </header>

    <main class="content">
      <section class="file-list-wrap" id="fileListWrap">
        <div id="libraryBanner" class="library-banner hidden"></div>
        <div class="file-list-header" id="fileListHeader">
          <span class="col-track">#</span>
          <span class="col-icon"></span>
          <span class="col-name sortable" data-sort="name"><span class="cell-text">Name<span class="sort-arrow hidden"></span></span></span>
          <span class="col-title sortable" data-sort="title"><span class="cell-text">Title<span class="sort-arrow hidden"></span></span><div class="col-resize-handle" data-col="title"></div></span>
          <span class="col-artist sortable" data-sort="artist"><span class="cell-text">Artist<span class="sort-arrow hidden"></span></span><div class="col-resize-handle" data-col="artist"></div></span>
          <span class="col-album sortable" data-sort="album"><span class="cell-text">Album<span class="sort-arrow hidden"></span></span><div class="col-resize-handle" data-col="album"></div></span>
          <span class="col-duration sortable" data-sort="duration"><span class="cell-text">Duration<span class="sort-arrow hidden"></span></span><div class="col-resize-handle" data-col="duration"></div></span>
          <span class="col-size sortable" data-sort="size"><span class="cell-text">Size<span class="sort-arrow hidden"></span></span><div class="col-resize-handle" data-col="size"></div></span>
        </div>
        <section class="file-list" id="fileList"></section>
        <div id="dropOverlay" class="drop-overlay hidden">Drop here to upload</div>
      </section>

      <div id="sidebarResizeHandle" class="sidebar-resize-handle" title="Drag to resize"></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-tabs">
          <button class="tab-btn active" data-tab="queue">Queue</button>
          <button class="tab-btn" data-tab="playlists">Playlists</button>
        </div>
        <div class="queue-toolbar" id="queueToolbar">
          <button id="clearQueueBtn" title="Clear queue"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><use href="#icon-trash"></use></svg>Clear</button>
          <button id="shuffleQueueBtn" title="Shuffle queue"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><use href="#icon-shuffle"></use></svg>Shuffle</button>
        </div>
        <div class="tab-panel" id="queuePanel"></div>
        <div class="tab-panel hidden" id="playlistsPanel"></div>
      </aside>
    </main>

    <div class="player-blur-group">
      <div class="player-blur-bg"></div>
      <div class="lyrics-box-wrap hidden">
        <button id="lyricsToggleBtn" class="lyrics-toggle-btn" title="Show lyrics">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
        <div id="lyricsBox" class="lyrics-box">
          <div id="lyricsResizeHandle" class="lyrics-resize-handle" title="Drag to resize"></div>
          <div class="lyrics-box-header">
            <div class="lyrics-header-spacer"></div>
            <div class="lyrics-scroll-toggle-wrap" title="Toggle auto/manual scroll">
              <svg class="lyrics-toggle-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 12V6a1.5 1.5 0 0 1 3 0v5"></path>
                <path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V11"></path>
                <path d="M14 11.5V6a1.5 1.5 0 0 1 3 0v6"></path>
                <path d="M17 12.5V9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7l-2.7-4a1.5 1.5 0 0 1 2.4-1.8L9 14"></path>
              </svg>
              <button id="lyricsScrollModeBtn" class="ios-toggle" role="switch" title="Toggle auto/manual scroll"><span class="ios-toggle-thumb"></span></button>
              <svg class="lyrics-toggle-icon lyrics-toggle-icon-auto" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12a8 8 0 0 1 8-8 8 8 0 0 1 6.93 4"></path>
                <polyline points="19 3 19 8 14 8"></polyline>
                <path d="M20 12a8 8 0 0 1-8 8 8 8 0 0 1-6.93-4"></path>
                <polyline points="5 21 5 16 10 16"></polyline>
                <text x="12" y="14.5" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">A</text>
              </svg>
            </div>
            <button id="lyricsFetchEmptyBtn" class="lyrics-header-btn" title="Fetch lyrics from LRCLIB">Fetch lyrics</button>
            <button id="lyricsEditBtn" class="lyrics-header-icon-btn" title="Edit lyrics">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
          </div>
          <div id="lyricsContent" class="lyrics-content">
            <div id="lyricsEmpty" class="lyrics-empty">No lyrics found</div>
            <div id="lyricsLines" class="lyrics-lines"></div>
          </div>
        </div>
      </div>

      <footer class="player-bar hidden" id="playerBar">
      <div class="now-playing">
        <img id="playerArt" class="player-art hidden" alt="">
        <span id="playerArtIcon" class="player-art-icon">🎵</span>
        <div class="now-playing-text">
          <div class="marquee-wrap"><div class="track-name" id="trackName"><span></span></div></div>
          <div class="marquee-wrap"><div class="track-path" id="trackPath"><span></span></div></div>
        </div>
      </div>
      <div class="player-controls">
        <button id="shuffleBtn" title="Shuffle queue">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-shuffle"></use></svg>
        </button>
        <button id="prevBtn" title="Previous">⏮</button>
        <button id="playPauseBtn" title="Play/Pause">▶</button>
        <button id="nextBtn" title="Next">⏭</button>
        <button id="loopBtn" title="Loop: off"></button>
        <span class="time" id="timeDisplay">0:00 / -0:00</span>
        <input type="range" id="seekBar" min="0" max="100" step="0.01" value="0">
        <div class="speed-wrap">
          <button id="speedBtn" title="Playback speed">1x</button>
          <div id="speedMenu" class="speed-menu hidden"></div>
        </div>
        <button id="muteBtn" title="Mute">
          <svg id="muteIconOn" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 8 9 13 4 13 20 8 15 3 15 3 9"></polygon><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a9 9 0 0 1 0 12"></path></svg>
          <svg id="muteIconOff" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 8 9 13 4 13 20 8 15 3 15 3 9"></polygon><line x1="16" y1="9" x2="22" y2="15"></line><line x1="22" y1="9" x2="16" y2="15"></line></svg>
        </button>
        <input type="range" id="volumeBar" min="0" max="100" value="100" title="Volume">
        <button id="openFolderBtn" title="Open containing folder"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-folder"></use></svg></button>
        <button id="deleteTrackBtn" title="Delete this track"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-trash"></use></svg></button>
        <button id="closePlayerBtn" title="Close player">✕</button>
      </div>
      <audio id="audioEl"></audio>
    </footer>
    </div>
  </div>

  <!-- Context menu -->
  <div id="contextMenu" class="context-menu hidden"></div>
  <!-- Modal for playlist name input -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div id="modalTitle">Title</div>
      <input type="text" id="modalInput" />
      <div class="modal-actions">
        <button id="modalCancel">Cancel</button>
        <button id="modalOk">OK</button>
      </div>
    </div>
  </div>

  <!-- Login modal -->
  <div id="loginOverlay" class="modal-overlay hidden">
    <div class="modal login-modal">
      <div class="login-title">Log in</div>
      <input type="password" id="loginInput" placeholder="Password" autocomplete="current-password" />
      <div id="loginError" class="login-error hidden"></div>
      <div class="modal-actions login-actions">
        <button id="loginCancel">Cancel</button>
        <button id="loginOk">Log in</button>
      </div>
    </div>
  </div>

  <!-- Metadata editor -->
  <div id="metaOverlay" class="modal-overlay hidden">
    <div class="modal meta-modal">
      <div class="meta-header">
        <label class="meta-group-toggle" id="metaGroupWrap"><input type="checkbox" id="metaGroupChk"> Edit as group</label>
        <span id="metaFileCounter" class="meta-file-counter"></span>
      </div>
      <div class="meta-file-nav">
        <button id="metaPrevBtn" title="Previous file">◀</button>
        <input type="text" id="metaFilename" placeholder="Filename" autocomplete="off">
        <button id="metaNextBtn" title="Next file">▶</button>
      </div>
      <div class="meta-body">
        <div class="meta-art-panel">
          <div class="meta-art-preview">
            <img id="metaArtImg" class="meta-art hidden" alt="">
            <div id="metaArtPlaceholder" class="meta-art-placeholder">🎵</div>
            <div id="metaArtSplit" class="meta-art-split hidden">
              <div class="meta-art-split-half">
                <img id="metaArtOldImg" class="hidden" alt="">
                <div id="metaArtOldPlaceholder" class="meta-art-placeholder">🎵</div>
              </div>
              <div class="meta-art-split-half meta-art-split-new">
                <img id="metaArtNewImg" alt="">
              </div>
            </div>
          </div>
          <div class="meta-art-actions">
            <button id="metaArtUploadBtn" title="Upload new image">Upload</button>
            <button id="metaArtDeleteBtn" title="Remove embedded art">Delete</button>
            <button id="metaArtKeepBtn" title="Keep current art">Reset</button>
          </div>
          <label class="meta-art-broadcast" id="metaArtBroadcastWrap" title="Apply this image to every selected file"><input type="checkbox" id="metaArtBroadcastChk"> Use this image</label>
          <div class="meta-art-nav">
            <button id="metaArtPrevBtn" title="Previous art">◀</button>
            <span id="metaArtIndex" class="meta-art-index"></span>
            <button id="metaArtNextBtn" title="Next art">▶</button>
          </div>
          <div id="metaArtChangedCount" class="meta-art-changed-count"></div>
          <input type="file" id="metaArtInput" accept="image/jpeg,image/png" hidden>
          <div id="metaArtStatus" class="meta-art-status"></div>
        </div>
        <div class="meta-fields">
          <div class="meta-row" id="metaFilenameSingleRow"><label for="metaFilenameSingle">Filename</label><input type="text" id="metaFilenameSingle" placeholder="Filename" autocomplete="off"></div>
          <div class="meta-row"><label for="metaField-title">Title</label><div class="meta-input-wrap"><input type="text" id="metaField-title" autocomplete="off"><button type="button" class="meta-field-arrow-btn" data-field="title" title="Show all values"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-chevron-down"></use></svg></button><datalist id="dl-title"></datalist></div></div>
          <div class="meta-row"><label for="metaField-artist">Artist</label><div class="meta-input-wrap"><input type="text" id="metaField-artist" autocomplete="off"><button type="button" class="meta-field-arrow-btn" data-field="artist" title="Show all values"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-chevron-down"></use></svg></button><datalist id="dl-artist"></datalist></div></div>
          <div class="meta-row"><label for="metaField-album">Album</label><div class="meta-input-wrap"><input type="text" id="metaField-album" autocomplete="off"><button type="button" class="meta-field-arrow-btn" data-field="album" title="Show all values"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-chevron-down"></use></svg></button><datalist id="dl-album"></datalist></div></div>
          <div class="meta-row"><label for="metaField-year">Year</label><div class="meta-input-wrap"><input type="text" id="metaField-year" autocomplete="off"><button type="button" class="meta-field-arrow-btn" data-field="year" title="Show all values"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-chevron-down"></use></svg></button><datalist id="dl-year"></datalist></div></div>
          <div class="meta-row"><label for="metaField-track">Track</label><div class="meta-input-wrap"><input type="text" id="metaField-track" autocomplete="off"><button type="button" class="meta-field-arrow-btn" data-field="track" title="Show all values"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-chevron-down"></use></svg></button><datalist id="dl-track"></datalist></div></div>
          <div class="meta-row"><label for="metaField-disc">Disc</label><div class="meta-input-wrap"><input type="text" id="metaField-disc" autocomplete="off"><button type="button" class="meta-field-arrow-btn" data-field="disc" title="Show all values"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-chevron-down"></use></svg></button><datalist id="dl-disc"></datalist></div></div>
        </div>
      </div>
      <div class="meta-row meta-row-lyrics" id="metaLyricsRow">
        <label for="metaFieldLyrics"></label>
        <div class="meta-lyrics-wrap">
          <textarea id="metaFieldLyrics" rows="6" placeholder="No lyrics"></textarea>
          <div class="meta-lyrics-actions">
            <button type="button" id="metaLyricsLrclibBtn" title="Search this song on LRCLIB">LRCLIB<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></button>
            <button type="button" id="metaLyricsFetchBtn">Fetch lyrics</button>
            <button type="button" id="metaLyricsDeleteBtn">Delete lyrics</button>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="metaCancelBtn">Cancel</button>
        <button id="metaApplyBtn">Apply</button>
      </div>
    </div>
  </div>

  <!-- Settings panel -->
  <div id="settingsOverlay" class="modal-overlay hidden">
    <div class="modal settings-modal">
      <div class="settings-title">Settings</div>

      <div class="settings-row">
        <label for="seekBackInput">Rewind (left arrow)</label>
        <div class="settings-field">
          <input type="number" id="seekBackInput" min="1" max="300" step="1">
          <span>s</span>
        </div>
      </div>

      <div class="settings-row">
        <label for="seekForwardInput">Fast-forward (right arrow)</label>
        <div class="settings-field">
          <input type="number" id="seekForwardInput" min="1" max="300" step="1">
          <span>s</span>
        </div>
      </div>

      <div class="settings-row settings-row-checkbox">
        <label for="skipDeleteConfirmInput">Skip delete confirmation</label>
        <input type="checkbox" id="skipDeleteConfirmInput">
      </div>

      <div class="settings-row settings-row-checkbox">
        <label for="rememberVolumeInput">Remember volume between sessions</label>
        <input type="checkbox" id="rememberVolumeInput">
      </div>

      <div class="settings-row settings-row-checkbox">
        <label for="hideNonMusicInput">Hide non-music items</label>
        <input type="checkbox" id="hideNonMusicInput">
      </div>

      <div class="settings-row settings-row-checkbox">
        <label for="replayGainInput">Normalize volume (ReplayGain)</label>
        <input type="checkbox" id="replayGainInput">
      </div>

      <div class="settings-row settings-row-buttons">
        <button id="resetLayoutBtn">Reset layout</button>
        <button id="rebuildLibraryBtn">Update library metadata</button>
      </div>

      <div class="modal-actions">
        <button id="settingsCloseBtn">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
